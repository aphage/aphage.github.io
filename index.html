<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ariia</title><meta name="robots" content="noindex, follow"><link rel="canonical" href="https://ariia.pages.dev/zh/"><link rel="alternate" hreflang="zh-CN" href="https://ariia.pages.dev/zh/"><link rel="alternate" hreflang="en" href="https://ariia.pages.dev/en/"><link rel="alternate" hreflang="ja" href="https://ariia.pages.dev/ja/"><link rel="alternate" hreflang="x-default" href="https://ariia.pages.dev/zh/"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><script>(function(){const targets = {"zh":"/zh/","en":"/en/","ja":"/ja/"};
const fallback = "/zh/";
const LANG_STORAGE_KEY = "preferred-lang";

      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem(LANG_STORAGE_KEY);
        } catch (e) {}
        var pick = saved && targets[saved] ? saved : null;
        if (!pick) {
          var langs = navigator.languages || [navigator.language || ''];
          for (var i = 0; i < langs.length && !pick; i++) {
            var code = String(langs[i]).toLowerCase().split('-')[0];
            if (targets[code]) pick = code;
          }
        }
        location.replace((pick ? targets[pick] : fallback) + location.search + location.hash);
      })();
    })();</script><noscript><meta http-equiv="refresh" content="0; url=/zh/"></noscript><link rel="stylesheet" href="/_astro/themes.UKi-G9PJ.css"></head><body class="grid min-h-dvh place-items-center"><ul class="flex gap-4"><li><a href="/zh/" hreflang="zh-CN" class="text-accent hover:underline">简体中文</a></li><li><a href="/en/" hreflang="en" class="text-accent hover:underline">English</a></li><li><a href="/ja/" hreflang="ja" class="text-accent hover:underline">日本語</a></li></ul></body></html>
